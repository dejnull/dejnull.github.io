<!DOCTYPE html>
<html>
<head>
    <title>Contributor</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8fafc; /* Neutral background */
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .back-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: #14b8a6; /* Primary color */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .back-button:hover {
            background-color: #0f766e; /* Darker primary color */
        }
    </style>
</head>
<body>
    <img src="contributor.gif" alt="Contributor GIF">
    <a href="index.html" class="back-button">Back to Index</a>
</body>
</html>
